<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioPF</title>
    <!-- Library hls.js untuk support stream .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Tiada scrollbar */
            display: flex;
            padding: 16px;
            gap: 16px;
        }

        /* BAHAGIAN KIRI: PLAYER & LOGO */
        .left-panel {
            flex: 1;
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .logo-container {
            flex: 1;
            width: 100%;
            max-height: 48vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .station-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 8px;
            text-align: center;
        }

        /* ANIMATED EQUALIZER BARS */
        .eq-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 35px;
            width: 100%;
            margin-bottom: 10px;
            background: #141414;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }
        .eq-bar {
            width: 6px;
            height: 5px;
            background: linear-gradient(to top, #00e676, #00b0ff);
            border-radius: 3px;
            transition: height 0.1s ease;
        }

        /* Mode bila lagu tengah Play (Animasi Jalan) */
        .playing .eq-bar {
            animation: bounce 0.8s infinite alternate ease-in-out;
        }

        .playing .eq-bar:nth-child(1) { animation-duration: 0.4s; }
        .playing .eq-bar:nth-child(2) { animation-duration: 0.7s; }
        .playing .eq-bar:nth-child(3) { animation-duration: 0.5s; }
        .playing .eq-bar:nth-child(4) { animation-duration: 0.9s; }
        .playing .eq-bar:nth-child(5) { animation-duration: 0.6s; }
        .playing .eq-bar:nth-child(6) { animation-duration: 0.8s; }
        .playing .eq-bar:nth-child(7) { animation-duration: 0.5s; }
        .playing .eq-bar:nth-child(8) { animation-duration: 0.7s; }
        .playing .eq-bar:nth-child(9) { animation-duration: 0.4s; }
        .playing .eq-bar:nth-child(10){ animation-duration: 0.8s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 28px; }
        }

        /* CONTROLS (STOP / PLAY BUTTON & AUDIO) */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        .btn-playpause {
            background-color: #00e676;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        audio {
            display: none;
        }

        /* BAHAGIAN KANAN: GRID KOTAK LOGO BESAR */
        .right-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }
        .header-tag {
            font-size: 1rem;
            color: #ffab00;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .station-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            height: 100%;
            max-height: 88vh;
        }
        .btn-station {
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 14px;
            padding: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-station:active, .btn-station.active {
            background-color: #00e676;
            color: #000;
            border-color: #00e676;
        }
        /* SAIS LOGO DIBESARKAN DI SINI */
        .btn-station img {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
        }
        .btn-station span {
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <!-- KIRI: AUDIO PLAYER & EQUALIZER -->
    <div class="left-panel">
        <div class="logo-container">
            <img id="current-logo" src="https://media.suria.my/wp-content/uploads/2023/07/31100922/suria-logo.png" alt="Logo Radio">
        </div>
        <div class="station-title" id="current-title">Suria FM</div>

        <!-- BAR EQUALIZER NEON -->
        <div class="eq-container playing" id="eq-box">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>

        <div class="controls">
            <button class="btn-playpause" id="toggle-btn" onclick="togglePlay()">⏸ PAUSE</button>
        </div>

        <audio id="audio-player" autoplay></audio>
    </div>

    <!-- KANAN: BUTANG GRID KOTAK RADIOPF (LOGO BESAR) -->
    <div class="right-panel">
        <div class="station-grid">
            <button class="btn-station active" onclick="playRadio('Suria FM', 'https://27223.live.streamtheworld.com/SURIA_FMAAC.aac', 'https://media.suria.my/wp-content/uploads/2023/07/31100922/suria-logo.png', this)">
                <img src="https://media.suria.my/wp-content/uploads/2023/07/31100922/suria-logo.png"> <span>Suria FM</span>
            </button>
            <button class="btn-station" onclick="playRadio('Era FM', 'https://n05-us.rcs.revma.com/crec9cmbv4uvv/5_12hts4a4zpu1002/playlist.m3u8', 'https://static.wikia.nocookie.net/logopedia/images/6/67/ERA_logo_%282018%29.svg/revision/latest?cb=20240711074150', this)">
                <img src="https://static.wikia.nocookie.net/logopedia/images/6/67/ERA_logo_%282018%29.svg/revision/latest?cb=20240711074150"> <span>Era FM</span>
            </button>
            <button class="btn-station" onclick="playRadio('HOT FM', 'https://n01-us.rcs.revma.com/drakdf8mtd3vv/1_1ba7nuwcvljad02/playlist.m3u8', 'https://static.wikia.nocookie.net/logopedia/images/0/0f/Hot_FM_logo_%282021%29.svg/revision/latest/scale-to-width-down/1000?cb=20240630020739', this)">
                <img src="https://static.wikia.nocookie.net/logopedia/images/0/0f/Hot_FM_logo_%282021%29.svg/revision/latest/scale-to-width-down/1000?cb=20240630020739"> <span>HOT FM</span>
            </button>
            <button class="btn-station" onclick="playRadio('Rakita FM', 'https://22283.live.streamtheworld.com/RAKITAAAC.aac', 'https://static.wikia.nocookie.net/logopedia/images/a/ab/RAKITA.png/revision/latest?cb=20221013034327', this)">
                <img src="https://static.wikia.nocookie.net/logopedia/images/a/ab/RAKITA.png/revision/latest?cb=20221013034327"> <span>Rakita FM</span>
            </button>
            <button class="btn-station" onclick="playRadio('Sinar FM', 'https://n07-us.rcs.revma.com/azatk0tbv4uvv/7_13wyqvlqxz91t02/playlist.m3u8', 'https://static.wikia.nocookie.net/logopedia/images/6/62/Sinar_%282018%29.svg/revision/latest?cb=20240711082330', this)">
                <img src="https://static.wikia.nocookie.net/logopedia/images/6/62/Sinar_%282018%29.svg/revision/latest?cb=20240711082330"> <span>Sinar FM</span>
            </button>
             <button class="btn-station" onclick="playRadio('Gegar FM', 'https://n04-us.rcs.revma.com/cn0zcqsbv4uvv/4_kifdxur9y8nc02/playlist.m3u8', 'https://static.wikia.nocookie.net/logopedia/images/1/12/Gegar_%282018%29.svg/revision/latest?cb=20240715133440', this)">
                <img src="https://static.wikia.nocookie.net/logopedia/images/1/12/Gegar_%282018%29.svg/revision/latest?cb=20240715133440"> <span>Gegar FM</span>
            </button>
        </div>
    </div>

    <script>
        var player = document.getElementById('audio-player');
        var eqBox = document.getElementById('eq-box');
        var toggleBtn = document.getElementById('toggle-btn');
        var hls = new Hls();

        function playRadio(name, url, logo, btn) {
            document.getElementById('current-title').innerText = name;
            document.getElementById('current-logo').src = logo;

            var buttons = document.querySelectorAll('.btn-station');
            buttons.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');

            if (url.endsWith('.m3u8')) {
                if (Hls.isSupported()) {
                    hls.destroy();
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(player);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        player.play();
                    });
                } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                    player.src = url;
                    player.play();
                }
            } else {
                if (hls) { hls.destroy(); }
                player.src = url;
                player.play();
            }

            eqBox.classList.add('playing');
            toggleBtn.innerHTML = "⏸ PAUSE";
        }

        function togglePlay() {
            if (player.paused) {
                player.play();
                eqBox.classList.add('playing');
                toggleBtn.innerHTML = "⏸ PAUSE";
            } else {
                player.pause();
                eqBox.classList.remove('playing');
                toggleBtn.innerHTML = "▶ PLAY";
            }
        }

        window.onload = function() {
            var firstBtn = document.querySelector('.btn-station');
            playRadio('Suria FM', 'https://27223.live.streamtheworld.com/SURIA_FMAAC.aac', 'https://media.suria.my/wp-content/uploads/2023/07/31100922/suria-logo.png', firstBtn);
        };
    </script>
</body>
</html>
