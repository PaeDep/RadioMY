<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioPF</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b1a10; /* Default tint ERA */
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            padding: 16px;
            gap: 16px;
            transition: background-color 0.6s ease;
        }

        /* --- PANEL KIRI --- */
        .left-panel {
            flex: 1;
            background-color: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* JAM & TARIKH */
        .clock-container {
            width: 100%;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .clock-time {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00e676;
            letter-spacing: 1px;
            transition: color 0.5s ease;
        }
        .clock-date {
            font-size: 0.85rem;
            color: #aaaaaa;
            font-weight: 500;
        }

        .logo-container {
            flex: 1;
            width: 100%;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .station-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 12px;
            text-align: center;
            transition: color 0.5s ease;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            margin-bottom: 8px;
        }
        
        .btn-playstop {
            background-color: #00e676;
            border: none;
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .btn-playstop:hover {
            transform: scale(1.05);
        }
        audio { display: none; }

        /* --- PANEL KANAN --- */
        .right-panel {
            flex: 1.5;
            background-color: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .poster-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(15, 15, 15, 0.8);
            margin-bottom: 12px;
        }
        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .channel-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .btn-channel {
            background-color: #2a2a2a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 65px;
            transition: all 0.2s ease;
        }

        .btn-channel.active {
            background-color: #00e676;
            border-color: #00e676;
        }

        .btn-channel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 2px;
        }
    </style>
</head>
<body>

    <!-- PANEL KIRI -->
    <div class="left-panel">
        <div class="clock-container">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">Isnin, 1 Jan 2026</div>
        </div>

        <div class="logo-container">
            <img id="current-logo" src="https://upload.wikimedia.org/wikipedia/commons/6/67/ERA_logo_%282018%29.svg" alt="Logo Radio">
        </div>
        <div class="station-title" id="current-title">ERA FM</div>

        <div class="controls">
            <button class="btn-playstop" id="toggle-btn" onclick="togglePlay()">⏹</button>
        </div>

        <audio id="audio-player" autoplay></audio>
    </div>

    <!-- PANEL KANAN -->
    <div class="right-panel">
        <div class="poster-container">
            <img id="side-poster" src="https://media2.fishtank.my/media/era/assets2/gambar/era26-newkv-750x422.png" alt="Poster Stesen">
        </div>

        <div class="channel-row">
            <!-- ERA (Hijau) -->
            <button class="btn-channel active" onclick="playRadio('ERA FM', 'https://n05-us.rcs.revma.com/crec9cmbv4uvv/5_12hts4a4zpu1002/playlist.m3u8', 'https://upload.wikimedia.org/wikipedia/commons/6/67/ERA_logo_%282018%29.svg', 'https://media2.fishtank.my/media/era/assets2/gambar/era26-newkv-750x422.png', '#00e676', '#0a2215', this)">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/67/ERA_logo_%282018%29.svg" alt="ERA">
            </button>

            <!-- SINAR (Biru) -->
            <button class="btn-channel" onclick="playRadio('SINAR FM', 'https://n07-us.rcs.revma.com/azatk0tbv4uvv/7_13wyqvlqxz91t02/playlist.m3u8', 'https://upload.wikimedia.org/wikipedia/commons/6/62/Sinar_%282018%29.svg', 'https://assets.astroaudio.com.my/brands_syok/media/uploads/banner/2026-04/1_SYOK-750X422.jpg.jpeg', '#00b0ff', '#081c29', this)">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/62/Sinar_%282018%29.svg" alt="SINAR">
            </button>

            <!-- SURIA (Oren) - Logo Dibaiki -->
            <button class="btn-channel" onclick="playRadio('SURIA FM', 'https://27223.live.streamtheworld.com/SURIA_FMAAC.aac', 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Suria_FM_logo.png/600px-Suria_FM_logo.png', 'https://media.suria.my/wp-content/uploads/2025/11/21112036/SURIA-MAIN-BRANDING_SCREEN-SIZE.jpg', '#ff9100', '#291808', this)">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Suria_FM_logo.png/600px-Suria_FM_logo.png" alt="SURIA">
            </button>

            <!-- HOT (Merah) -->
            <button class="btn-channel" onclick="playRadio('HOT FM', 'https://n01-us.rcs.revma.com/drakdf8mtd3vv/1_1ba7nuwcvljad02/playlist.m3u8', 'https://upload.wikimedia.org/wikipedia/commons/0/0f/Hot_FM_logo_%282021%29.svg', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUWpqV2BKKKtswiMeYUFHQbYEhZg5U9qijgnS4QPrErSnZkh5ISzzDTpU&s=10', '#ff1744', '#2b0a10', this)">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Hot_FM_logo_%282021%29.svg" alt="HOT">
            </button>

            <!-- GEGAR (Kelabu/Biru Perak) -->
            <button class="btn-channel" onclick="playRadio('GEGAR FM', 'https://n04-us.rcs.revma.com/cn0zcqsbv4uvv/4_kifdxur9y8nc02/playlist.m3u8', 'https://upload.wikimedia.org/wikipedia/commons/1/12/Gegar_%282018%29.svg', 'https://media2.fishtank.my/media/gegar/assets/850x480.png?ext=.png', '#29b6f6', '#091f28', this)">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Gegar_%282018%29.svg" alt="GEGAR">
            </button>

            <!-- RAKITA (Kuning) -->
            <button class="btn-channel" onclick="playRadio('RAKITA FM', 'https://22283.live.streamtheworld.com/RAKITAAAC.aac', 'https://upload.wikimedia.org/wikipedia/commons/a/ab/RAKITA.png', 'https://assets.astroaudio.com.my/brands_syok/media/Article/2022/Jul/21/rakita_syok_still.jpg', '#ffd600', '#2b2408', this)">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/RAKITA.png" alt="RAKITA">
            </button>
        </div>
    </div>

    <script>
        var player = document.getElementById('audio-player');
        var toggleBtn = document.getElementById('toggle-btn');
        var currentLogoEl = document.getElementById('current-logo');
        var sidePosterEl = document.getElementById('side-poster');
        var hls = new Hls();

        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('clock-time').innerText = now.toLocaleTimeString('ms-MY', timeOptions);

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('clock-date').innerText = now.toLocaleDateString('ms-MY', dateOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // FUNGSI PLAY & TUKAR WARNA DENGAN PARAMETER WARNA KHUSUS
        function playRadio(name, url, logo, poster, accentColor, bgTint, btn) {
            document.getElementById('current-title').innerText = name;
            currentLogoEl.src = logo;
            sidePosterEl.src = poster;

            // Tukar warna tajuk, jam, butang play & latar belakang
            document.body.style.backgroundColor = bgTint;
            document.getElementById('current-title').style.color = accentColor;
            document.getElementById('clock-time').style.color = accentColor;
            toggleBtn.style.backgroundColor = accentColor;

            // Aktifkan border & warna pada ikon stesen pilihan
            document.querySelectorAll('.btn-channel').forEach(b => {
                b.classList.remove('active');
                b.style.backgroundColor = '#2a2a2a';
                b.style.borderColor = '#333';
            });
            btn.classList.add('active');
            btn.style.backgroundColor = accentColor;
            btn.style.borderColor = accentColor;

            // Logik memainkan stream audio
            if (url.endsWith('.m3u8')) {
                if (Hls.isSupported()) {
                    hls.destroy();
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(player);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
                } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                    player.src = url;
                    player.play();
                }
            } else {
                if (hls) { hls.destroy(); }
                player.src = url;
                player.play();
            }

            toggleBtn.innerText = "⏹";
        }

        function togglePlay() {
            if (player.paused) {
                player.play();
                toggleBtn.innerText = "⏹";
            } else {
                player.pause();
                toggleBtn.innerText = "▶";
            }
        }

        window.onload = function() {
            var firstBtn = document.querySelector('.btn-channel');
            playRadio('ERA FM', 'https://n05-us.rcs.revma.com/crec9cmbv4uvv/5_12hts4a4zpu1002/playlist.m3u8', 'https://upload.wikimedia.org/wikipedia/commons/6/67/ERA_logo_%282018%29.svg', 'https://media2.fishtank.my/media/era/assets2/gambar/era26-newkv-750x422.png', '#00e676', '#0a2215', firstBtn);
        };
    </script>
</body>
</html>
